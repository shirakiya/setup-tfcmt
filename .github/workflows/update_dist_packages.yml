name: Update dist packages

on: pull_request

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: generate-token
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - name: Setup Git
        run: |
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: npm run test
      - run: npm run package
      - name: Check if dist packages updated
        id: check-package-updated
        run: |
          if git diff --quiet dist/; then
            echo "no dist package changes detected"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "dist package changes detected"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      - name: Commit updated dist packages
        if: steps.check-package-updated.outputs.skip != 'true'
        run: |
          git add dist/
          git commit -m "Update dist packages"
      - name: Push changes
        if: steps.check-package-updated.outputs.skip != 'true'
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${HEAD_REF}"
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          HEAD_REF: ${{ github.head_ref }}
